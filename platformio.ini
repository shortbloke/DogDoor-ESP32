; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = private.ini
default_envs = um_pros3_serial, esp32_ota

[common]
custom_firmware_version = 1.0.63
lib_deps = 
	pololu/VL53L0X@1.3.1
	thomasfredericks/Bounce2@2.72
	adafruit/Adafruit SSD1306@2.5.17
	gin66/FastAccelStepper@1.2.7
	knolleary/PubSubClient@2.8
extra_scripts =
	pre:scripts/generate_version_file.py
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

[env:um_pros3_serial]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = um_pros3
framework = arduino
upload_port = /dev/cu.usbmodem*
monitor_speed = 115200
extends = common

[env:esp32_ota]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = um_pros3
framework = arduino
upload_protocol = espota
extends = common

[env:native]
platform = native
test_build_src = true
build_src_filter = +<DoorStateMachine.cpp>
lib_deps = throwtheswitch/Unity@2.6.1
